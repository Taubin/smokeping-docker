<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23141921%27/%3E%3Cpath d=%27M4 17h5l3-8 5 14 4-9 2 3h5%27 fill=%27none%27 stroke=%27%23ec5f28%27 stroke-width=%272.6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E" />
    <title>SmokePing — <##title##></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/smokeping-print.css" media="print">
    <script>
        window.options = {
            step: <##step##>
        };
        (function() {
            var saved = localStorage.getItem('sp-theme');
            if (saved === 'light' || saved === 'dark') {
                document.documentElement.setAttribute('data-theme', saved);
            }
        })();
    </script>
    <style>
        :root, [data-theme="dark"] {
            --bg-body: #141921;
            --bg-sidebar: #181e27;
            --bg-topbar: #181e27;
            --bg-card-header: #222833;
            --bg-card-body: #f0e0c6;
            --bg-input: #141921;
            --bg-hover: #232d3b;
            --bg-active: #1f2937;
            --border: #2a3441;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #38bdf8;
            --accent-warm: #ec5f28;
            --green: #22c55e;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            --graph-filter: brightness(0.89) sepia(0.21);
        }
        [data-theme="light"] {
            --bg-body: #f3f5f8;
            --bg-sidebar: #ffffff;
            --bg-topbar: #ffffff;
            --bg-card-header: #f8fafc;
            --bg-card-body: #ffffff;
            --bg-input: #f8fafc;
            --bg-hover: #f1f5f9;
            --bg-active: #e2e8f0;
            --border: #dce1e8;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --accent: #0284c7;
            --accent-warm: #ea580c;
            --green: #16a34a;
            --shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
            --graph-filter: none;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Inter", "Ubuntu", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: var(--bg-body);
            color: var(--text-primary);
            font-size: 15px;
            line-height: 1.5;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* Topbar */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 54px;
            background: var(--bg-topbar);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px 0 0;
            z-index: 1000;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            height: 100%;
        }
        .topbar-brand {
            width: 260px;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 18px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            font-weight: 400;
            font-size: 19px;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }
        .brand:hover { text-decoration: none; }
        .brand strong {
            font-weight: 700;
            color: var(--text-primary);
        }
        .brand span {
            color: var(--accent-warm);
            font-weight: 400;
        }
        #menu-button {
            margin-left: 14px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            padding: 6px 10px;
        }
        #menu-button:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .icon-btn {
            background: var(--bg-card-header);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .icon-btn:hover { background: var(--bg-hover); }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .refresh-pill {
            background: var(--bg-card-header);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 13px;
            color: var(--text-primary);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--green);
            display: inline-block;
        }
        .status-dot.paused { background: var(--text-secondary); }
        .countdown {
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            padding-left: 6px;
            border-left: 1px solid var(--border);
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 54px; bottom: 0; left: 0;
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 14px 12px 24px;
            transition: transform 0.2s ease;
            z-index: 900;
        }
        body.sidebar-collapsed .sidebar { transform: translateX(-260px); }
        body.sidebar-collapsed .main-wrap { margin-left: 0; }

        .home-btn {
            display: block;
            padding: 6px 10px 10px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .home-btn:hover { color: var(--accent-warm); text-decoration: none; }

        #sidebar form {
            font-size: 0;
            margin: 0 0 12px;
        }
        #sidebar input[type="text"],
        #sidebar input[type="search"] {
            width: 100%;
            padding: 8px 14px;
            background: var(--bg-input);
            border: 1px solid transparent;
            border-radius: 999px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            margin: 0;
        }
        #sidebar input[type="text"]:focus,
        #sidebar input[type="search"]:focus { border-color: var(--border); }

        #sidebar ul {
            list-style: none;
            margin: 0;
            padding: 0;
            border-left: none !important;
        }
        #sidebar ul ul {
            padding: 4px 6px 6px 14px;
            border-left: none !important;
        }
        #sidebar li { margin: 2px 0; }
        #sidebar li.menuactive,
        #sidebar li.menuopen {
            margin: 6px 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.015);
        }
        #sidebar a.menulink,
        #sidebar a.menulinkactive {
            display: block;
            width: 100%;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid transparent;
            color: #c9d1d9;
            font-size: 14px;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        [data-theme="light"] #sidebar a.menulink { color: var(--text-secondary); }
        #sidebar a.menulink:hover,
        #sidebar a.menulinkactive:hover {
            background: var(--bg-hover);
            border-color: var(--border);
            color: var(--text-primary);
            text-decoration: none;
        }
        #sidebar li.menuactive > a,
        #sidebar li.menuopen > a {
            background: var(--bg-card-header);
            border-radius: 0;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--accent-warm) !important;
            font-weight: 600;
            padding: 8px 10px;
        }
        #sidebar ul ul li.menuactive,
        #sidebar ul ul li.menuopen {
            border: none;
            margin: 2px 0;
            background: transparent;
        }
        #sidebar ul ul li.menuactive > a,
        #sidebar ul ul li.menuopen > a {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 6px 10px;
        }
        .sidebar-logos { display: none; }

        /* Main Area */
        .main-wrap {
            margin-left: 260px;
            padding: 74px 24px 32px;
            transition: margin-left 0.2s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            padding: 24px;
        }
        .main-content > h1 {
            margin: 0 0 14px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .main-content > h2 {
            margin: 0 0 18px;
            font-size: 15px;
            font-weight: 400;
            color: var(--text-secondary);
        }
        .main-content > h2:empty { display: none; margin: 0; }

        /* Card Grid matching smokeping.interwebz.nz */
        .overview, .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(560px, 1fr));
            align-items: end;
            gap: 18px;
        }
        .overview:empty, .details:empty { display: none; }
        .overview > h1, .overview > h2, .overview > h3,
        .details > h1, .details > h2, .details > h3 {
            grid-column: 1 / -1;
            margin: 0 0 4px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .sp-card {
            background: var(--bg-card-header);
            border: none;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .sp-card-header {
            background: var(--bg-card-header);
            border-bottom: none;
            padding: 10px 14px;
            font-size: 14.5px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sp-card-header a {
            color: var(--text-primary);
            text-decoration: none;
        }
        .sp-card-header a:hover {
            color: var(--accent);
        }
        .sp-card-body {
            padding: 10px;
            background: var(--bg-card-body);
            border-radius: 0 0 10px 10px;
            overflow-x: auto;
        }
        .sp-card-body p { margin: 0; }
        .sp-card-body img {
            max-width: 100%;
            width: auto;
            height: auto;
            margin: 0 auto;
            border-radius: 6px;
            display: block;
            filter: var(--graph-filter);
        }
        /* Hide duplicate native SmokePing headings inside card bodies once promoted to sp-card-header */
        .sp-card-body h1,
        .sp-card-body h2,
        .sp-card-body h3 {
            display: none;
        }

        /* Footer */
        .footer {
            margin-top: 32px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        @media (max-width: 900px) {
            .sidebar { transform: translateX(-260px); }
            body.sidebar-open .sidebar { transform: translateX(0); }
            .main-wrap { margin-left: 0; padding: 70px 14px 24px; }
            .overview, .details { grid-template-columns: 1fr; }
        }
                            .overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(560px, 1fr));
            gap: 20px;
            align-items: start;
        }
        .overview > div {
            width: 100%;
        }
            .details > div {
            width: fit-content;
            max-width: 100%;
        }
    </style>
</head>
<body id="body">

<header class="topbar">
    <div class="topbar-left">
        <div class="topbar-brand">
            <a class="brand" href="./"><strong>smokeping</strong><span>.thinkserver</span></a>
        </div>
        <button class="icon-btn" id="menu-button" type="button" title="Toggle Menu">☰</button>
    </div>
    <div class="topbar-right">
        <div class="refresh-pill" id="refresh-button" title="Click to toggle Auto Refresh">
            <span class="status-dot" id="refresh-dot"></span>
            <span id="refresh-label">Auto Refresh</span>
            <span class="countdown" id="refresh-timer">5:00</span>
        </div>
        <button class="icon-btn" id="theme-toggle" type="button" title="Toggle Dark/Light Theme">☾</button>
    </div>
</header>

<aside class="sidebar" id="sidebar">
    <a class="home-btn" href="./">HOME</a>
    <##menu##>
    <div class="sidebar-logos">
        <##smokelogo##>
        <##rrdlogo##>
    </div>
</aside>

<div class="main-wrap">
    <main class="main-content">
        <h1><##title##></h1>
        <h2><##remark##></h2>

        <div class="overview">
            <##overview##>
        </div>

        <div class="details">
            <##body##>
        </div>
    </main>

        <footer class="footer" style="display: flex; justify-content: space-between; align-items: center;">
        <div>Maintained by Dusty</div>
        <div>Running on SmokePing-2.9.0 by Tobi Oetiker and Niko Tyni</div>
    </footer>
</div>

<script src="js/prototype.js" type="text/javascript"></script>
<script src="js/scriptaculous/scriptaculous.js?load=builder,effects,dragdrop" type="text/javascript"></script>
<script src="js/cropper/cropper.js" type="text/javascript"></script>
<script src="js/smokeping.js" type="text/javascript"></script>
<script>
(function() {
    // Build lookup map of target URLs -> human-readable menu names from the sidebar
    var menuMap = {};
    document.querySelectorAll('#sidebar a.menulink').forEach(function(a) {
        var href = a.getAttribute('href');
        if (!href) return;
        var norm = href.replace(/^\.\//, '').replace(/^\//, '');
        menuMap[norm] = a.textContent.trim();
        var qIdx = norm.indexOf('?');
        if (qIdx !== -1) {
            menuMap[norm.slice(qIdx)] = a.textContent.trim();
        }
    });

    // Normalize every card across Overview, Detail, and Charts views
    function upgradeCards(containerSelector) {
        var container = document.querySelector(containerSelector);
        if (!container) return;

        // SmokePing puts each graph block inside a child div (e.g. .panel or plain div)
        var blocks = Array.prototype.slice.call(container.children).filter(function(el) {
            return el.tagName === 'DIV' && el.querySelector('img');
        });

        blocks.forEach(function(block) {
            if (block.classList.contains('sp-card')) return;

            var title = '';
            var href = '';
            var heading = block.querySelector('h2, h3');
            var link = block.querySelector('a[href]');
            var img = block.querySelector('img');

            // On Detail pages, map SmokePing's _last_<seconds>.png suffix to the exact range label
            if (containerSelector === '.details' && img && img.getAttribute('src')) {
                var rangeMatch = img.getAttribute('src').match(/_last_(\d+)\.png/);
                if (rangeMatch) {
                    var secs = parseInt(rangeMatch[1], 10);
                    var rangeLabels = {
                        10800: 'Last 3 Hours',
                        108000: 'Last 30 Hours',
                        864000: 'Last 10 Days',
                        31104000: 'Last 360 Days'
                    };
                    if (rangeLabels[secs]) {
                        title = rangeLabels[secs];
                    } else if (secs >= 86400) {
                        title = 'Last ' + Math.round(secs / 86400) + ' Days';
                    } else {
                        title = 'Last ' + Math.round(secs / 3600) + ' Hours';
                    }
                }
            }

            if (!title && heading && heading.textContent.trim()) {
                title = heading.textContent.trim();
                var hLink = heading.querySelector('a[href]');
                if (hLink) href = hLink.getAttribute('href');
            }

            if (!title && link) {
                href = link.getAttribute('href') || '';
                var norm = href.replace(/^\.\//, '').replace(/^\//, '');
                var qIdx = norm.indexOf('?');
                title = menuMap[norm] || (qIdx !== -1 ? menuMap[norm.slice(qIdx)] : '') || '';
                if (!title && qIdx !== -1) {
                    // Fallback: format last segment of ?target=Group.SubTarget
                    var m = norm.match(/target=([^&]+)/);
                    if (m) {
                        var parts = decodeURIComponent(m[1]).split('.');
                        title = parts[parts.length - 1];
                    }
                }
            }

            if (!title) {
                var img = block.querySelector('img');
                if (img) title = img.getAttribute('alt') || img.getAttribute('title') || 'Graph';
            }

            block.classList.add('sp-card');

            var body = document.createElement('div');
            body.className = 'sp-card-body';
            while (block.firstChild) {
                body.appendChild(block.firstChild);
            }

            var header = document.createElement('div');
            header.className = 'sp-card-header';
            if (href) {
                var a = document.createElement('a');
                a.href = href;
                a.textContent = title;
                header.appendChild(a);
            } else {
                header.textContent = title;
            }

            block.appendChild(header);
            block.appendChild(body);
        });
    }

    upgradeCards('.overview');
    upgradeCards('.details');

    // Sidebar toggle
    var menuBtn = document.getElementById('menu-button');
    if (menuBtn) {
        menuBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (window.innerWidth <= 900) {
                document.body.classList.toggle('sidebar-open');
            } else {
                document.body.classList.toggle('sidebar-collapsed');
            }
        });
    }

    // Theme toggle
    var themeBtn = document.getElementById('theme-toggle');
    function syncThemeIcon() {
        var isLight = document.documentElement.getAttribute('data-theme') === 'light';
        if (themeBtn) themeBtn.textContent = isLight ? '☀' : '☾';
    }
    syncThemeIcon();
    if (themeBtn) {
        themeBtn.addEventListener('click', function() {
            var current = document.documentElement.getAttribute('data-theme');
            var next = current === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('sp-theme', next);
            syncThemeIcon();
        });
    }

    // Auto-refresh countdown synced to SmokePing step
    var step = (window.options && window.options.step) ? parseInt(window.options.step, 10) : 300;
    var remaining = step;
    var paused = localStorage.getItem('sp-refresh-paused') === '1';
    var dot = document.getElementById('refresh-dot');
    var timerEl = document.getElementById('refresh-timer');
    var refreshBtn = document.getElementById('refresh-button');

    function renderTimer() {
        if (dot) dot.className = paused ? 'status-dot paused' : 'status-dot';
        if (!timerEl) return;
        if (paused) {
            timerEl.textContent = 'Paused';
            return;
        }
        var m = Math.floor(remaining / 60);
        var s = remaining % 60;
        timerEl.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    }
    renderTimer();

    if (refreshBtn) {
        refreshBtn.addEventListener('click', function(e) {
            e.preventDefault();
            paused = !paused;
            localStorage.setItem('sp-refresh-paused', paused ? '1' : '0');
            if (!paused) remaining = step;
            renderTimer();
        });
    }

    setInterval(function() {
        if (paused) return;
        remaining--;
        if (remaining <= 0) {
            window.location.reload();
        } else {
            renderTimer();
        }
    }, 1000);
})();
</script>
</body>
</html>
